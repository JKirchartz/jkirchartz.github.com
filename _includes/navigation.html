<script>
        const popover = document.getElementById('navbar');
        const navbar_open_btn = document.getElementById('menuopen');
        popover.addEventListener('beforetoggle', (evt) => {
                if (evt.newState === 'open') {
                        navbar_open_btn.classList.add('hidden');
                } else {
                        navbar_open_btn.classList.remove('hidden');
                }
        });
</script>
