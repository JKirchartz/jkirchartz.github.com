<div class="article">
  <a href="{{ post.url }}">
    <h2>
      {% if post.projectName %}{{ post.projectName }}{% else %}{{ post.title }}{% endif %}
      {% include time.html %}
    </h2>
  </a>
  {% if post.projectImg %}<img class="card-img-top" src="{{ post.projectImg }}" alt="{% if post.projectName %}{{ post.projectName }}{% else %}{{ post.title }}{% endif %} screenshot"/>{% endif %}
  <p>
    {% if post.excerpt %}
      {{ post.excerpt | strip_html }}&hellip;
    {% endif %}
    <a href="{{post.url }}">See More &raquo;</a>
  </p>
</div>
